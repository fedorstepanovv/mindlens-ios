# SwiftLint owns correctness and code-smell rules.
# swift-format owns formatting (see .swift-format). Rules that overlap with the
# formatter are disabled here so the two tools cannot disagree.

included:
  - Packages/MindlensKit/Sources
  - Packages/MindlensKit/Tests
  - mindlens

excluded:
  - Packages/MindlensKit/.build
  - DerivedData
  - "**/*.generated.swift"

disabled_rules:
  # Formatting — owned by swift-format.
  - trailing_comma
  - opening_brace
  - statement_position
  - vertical_whitespace
  # Noise in a codebase that uses SwiftUI modifiers heavily.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

analyzer_rules:
  - unused_declaration
  - unused_import

# A crash in a mood-tracking app costs a user their day's entry. Force-unwrapping and
# IUOs are errors, not warnings.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error
implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 110
  error: 140
  ignores_urls: true
  ignores_comments: false

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 2
  excluded: [id, x, y, to, up]

nesting:
  type_level: 2

trailing_whitespace:
  ignores_empty_lines: true

# Guards for mistakes already made here — see docs/LESSONS.md.
# A correction that stays prose gets relearned; a correction that fails the build does not.
custom_rules:
  localized_needs_bundle:
    name: "Localized string without bundle"
    regex: 'String\(localized:\s*"[^"]*"\s*\)'
    message: "String(localized:) in a package target resolves against Bundle.main unless you pass bundle: .module — it will silently never localize."
    severity: error

  text_needs_bundle:
    name: "SwiftUI text literal without bundle"
    included: ".*/Packages/MindlensKit/Sources/.*"
    regex: '(?:Text|Button|Toggle|Link|NavigationLink|accessibilityLabel|accessibilityHint)\(\s*"[^"]*"\s*\)|Label\(\s*"[^"]*"\s*,\s*systemImage:'
    message: "A localized string in a package target resolves against Bundle.main unless you pass bundle: .module — it will silently never localize. Use the (_:bundle:) form, an explicit Text(…, bundle: .module) label, or Text(verbatim:) if the string genuinely is not copy."
    severity: error

  no_task_in_didset:
    name: "Task spawned from a property setter"
    regex: 'didSet\s*\{[^}]*Task\s*\{'
    message: "Drive loads from .task(id:) in the view, not a property setter. didSet spawns uncancelled overlapping work. See docs/PATTERNS.md."
    severity: error

  no_impl_suffix:
    name: "Impl suffix"
    regex: '(class|struct|final class)\s+\w+Impl\b'
    message: "Name the type for what it is (APIAuthRepository), not Impl. See CLAUDE.md."
    severity: error

reporter: "xcode"
