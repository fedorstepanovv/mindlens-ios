# The gate that stands between a pull request and main.
#
# Three jobs. `build` proves the code compiles and the suite is green. `idiom` runs
# Tools/swiftgate, which asks whether the Swift is Swift — or Flutter with different
# syntax. `gate` is the only job branch protection names, so jobs can be added or
# renamed here without touching the protection rule.
name: PR gate

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled are here so applying the override label re-runs the gate
    # instead of leaving a stale red check.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Naming a specific iPhone pins the build to whatever the runner image
          # happens to ship this month. Take whichever one is actually there.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 "$udid"
          # Boot it now, so it is warm by the time the launch test runs. Left to xcodebuild,
          # the boot happened inside the first UI test, took anywhere from 73 to 928 seconds
          # on these runners, and 3 of 5 runs failed on whichever test launched first.
          xcrun simctl bootstatus "$udid" -b

      - name: Test MindlensKit
        working-directory: Packages/MindlensKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme MindlensKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/MindlensKit.xcresult" \
            -quiet

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme mindlens \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet

      # A green build says the app compiles, not that it runs. It once compiled cleanly and
      # then died on the first line of the composition root. Two launches — default, and the
      # largest accessibility text size — are the cheapest test that would have caught it.
      - name: Launch the app
        run: |
          set -o pipefail
          # A launch that fails on a starved runner is retried; a launch that crashes
          # fails all three times, which is the case the test exists for.
          xcodebuild test \
            -scheme mindlens \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:mindlensUITests \
            -retry-tests-on-failure -test-iterations 3 \
            -quiet

      - name: Verify the settings the documents claim
        run: Tools/check-build-settings.sh "id=${{ steps.sim.outputs.udid }}"

      # Not on the runner image, despite being on every developer machine here.
      # This tracks latest: a SwiftLint release that adds a default rule can turn a
      # green branch red with no code change. Pin it if that ever happens.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: |
          set -euo pipefail
          swiftlint --strict
          # Tests are linted too. Leaving them out is how a force-unwrap in
          # TestSupport passed the gate while failing a local full-tree lint.
          xcrun swift-format lint --recursive --strict \
            Packages/MindlensKit/Sources Packages/MindlensKit/Tests mindlens

      - name: Check documentation links
        run: python3 Tools/check-doc-links.py

  idiom:
    name: Swift idiom review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      # The Claude Code action wants this for its own GitHub auth handshake.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base. Without full history there is no
          # merge base to find, and every commit on main since the branch started
          # would be attributed to this PR.
          fetch-depth: 0

      - name: Check out the Flutter app as product spec
        id: spec
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: fedorstepanovv/mindlensapp
          token: ${{ secrets.FLUTTER_SPEC_TOKEN }}
          path: .swiftgate/flutter
          sparse-checkout: lib
          fetch-depth: 1

      - name: Note when the spec is unavailable
        if: steps.spec.outcome != 'success'
        run: echo "::warning::The Flutter spec repo could not be checked out — the review will judge the Swift on its own merits. Check the FLUTTER_SPEC_TOKEN secret."

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/swiftgate/go.mod
          cache-dependency-path: Tools/swiftgate/go.sum

      - name: Test the gate itself
        working-directory: Tools/swiftgate
        run: go test ./...

      - name: Build the gate
        working-directory: Tools/swiftgate
        run: go build -o "$RUNNER_TEMP/swiftgate" .

      # Deterministic rules run first and cost nothing. They also produce the brief the
      # reviewer reads, and tell the next step whether a review is worth starting.
      - name: Prepare the review
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTGATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/swiftgate" prepare --pr ${{ github.event.pull_request.number }}'

      # The judgement half. Running it as Claude Code rather than a direct API call is
      # what bills it to the Claude subscription behind CLAUDE_CODE_OAUTH_TOKEN.
      # continue-on-error so a rate limit becomes a reported blocker with a re-run
      # instruction, rather than a bare red job with no explanation on the PR.
      # The token was once stored with a leading space. The action masked it, hid the
      # 401 behind "output hidden for security", and three runs failed with no cause.
      # Compare, never print.
      - name: Check the token is not padded
        if: steps.prep.outputs.review == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set."; exit 1; }
          [ "$TOKEN" = "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN has leading or trailing whitespace — re-set it with the value trimmed."; exit 1; }

      - name: Review for Flutter-isms
        id: reviewer
        if: steps.prep.outputs.review == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Three runs died at turn 1 with an empty modelUsage and the cause hidden.
          # The output is the review's own reasoning over a private repo's diff; showing
          # it costs nothing and is the only way to read why the model was never called.
          show_full_output: true
          # Not "/idiom-review": the slash form resolved to nothing on the runner and
          # Claude exited with num_turns 0 and an empty modelUsage. Pointing at the file
          # keeps one copy of the rubric without depending on skill dispatch.
          # The action restores .claude/ from main because a PR head is untrusted, and
          # keeps the PR's own copy under .claude-pr/. Until the skill is on main, that
          # copy is the only one on the runner; once it is, the first path wins.
          prompt: |
            Read .claude/skills/idiom-review/SKILL.md and follow it exactly. If that file
            does not exist, Glob for .claude-pr/**/idiom-review/SKILL.md, read the match,
            and follow that one exactly instead.
          claude_args: |
            --max-turns 40
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Write"

      - name: Decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTGATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/swiftgate" decide \
            --comment \
            --inline \
            --reviewer-ran ${{ steps.reviewer.outcome == 'success' }} \
            --json "$RUNNER_TEMP/findings.json"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftgate-findings
          path: |
            ${{ runner.temp }}/findings.json
            .swiftgate/run/
          if-no-files-found: ignore

  gate:
    name: Gate
    if: always()
    needs: [build, idiom]
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          build='${{ needs.build.result }}'
          idiom='${{ needs.idiom.result }}'
          echo "build: $build"
          echo "idiom: $idiom"
          failed=0
          [ "$build" = "success" ] || { echo "::error::Build or tests failed."; failed=1; }
          [ "$idiom" = "success" ] || { echo "::error::The Swift idiom review is blocking this merge. Read the review comment on the pull request."; failed=1; }
          exit $failed
