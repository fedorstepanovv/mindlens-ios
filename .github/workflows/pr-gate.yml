# The gate that stands between a pull request and main.
#
# Three jobs. `build` proves the code compiles and the suite is green. `idiom` runs
# Tools/swiftgate, which asks whether the Swift is Swift — or Flutter with different
# syntax. `gate` is the only job branch protection names, so jobs can be added or
# renamed here without touching the protection rule.
name: PR gate

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled are here so applying the override label re-runs the gate
    # instead of leaving a stale red check.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Naming a specific iPhone pins the build to whatever the runner image
          # happens to ship this month. Take whichever one is actually there.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 "$udid"

      - name: Test MindlensKit
        working-directory: Packages/MindlensKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme MindlensKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/MindlensKit.xcresult" \
            -quiet

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme mindlens \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet

      - name: Lint
        run: |
          set -euo pipefail
          swiftlint --strict
          xcrun swift-format lint --recursive --strict Packages/MindlensKit/Sources mindlens

      - name: Check documentation links
        run: python3 Tools/check-doc-links.py

  idiom:
    name: Swift idiom review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base. Without full history there is no
          # merge base to find, and every commit on main since the branch started
          # would be attributed to this PR.
          fetch-depth: 0

      - name: Check out the Flutter app as product spec
        id: spec
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: fedorstepanovv/mindlensapp
          token: ${{ secrets.FLUTTER_SPEC_TOKEN }}
          path: .swiftgate/flutter
          sparse-checkout: lib
          fetch-depth: 1

      - name: Note when the spec is unavailable
        if: steps.spec.outcome != 'success'
        run: echo "::warning::The Flutter spec repo could not be checked out — the review will judge the Swift on its own merits. Check the FLUTTER_SPEC_TOKEN secret."

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/swiftgate/go.mod
          cache-dependency-path: Tools/swiftgate/go.sum

      - name: Test the gate itself
        working-directory: Tools/swiftgate
        run: go test ./...

      - name: Build the gate
        working-directory: Tools/swiftgate
        run: go build -o "$RUNNER_TEMP/swiftgate" .

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_SHA is the merge commit on a pull_request event, which has no
          # permanent URL. Findings should link to the branch the author can edit.
          SWIFTGATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/swiftgate" \
            --pr ${{ github.event.pull_request.number }} \
            --comment \
            --inline \
            --verbose \
            --json "$RUNNER_TEMP/findings.json"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftgate-findings
          path: ${{ runner.temp }}/findings.json
          if-no-files-found: ignore

  gate:
    name: Gate
    if: always()
    needs: [build, idiom]
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          build='${{ needs.build.result }}'
          idiom='${{ needs.idiom.result }}'
          echo "build: $build"
          echo "idiom: $idiom"
          failed=0
          [ "$build" = "success" ] || { echo "::error::Build or tests failed."; failed=1; }
          [ "$idiom" = "success" ] || { echo "::error::The Swift idiom review is blocking this merge. Read the review comment on the pull request."; failed=1; }
          exit $failed
