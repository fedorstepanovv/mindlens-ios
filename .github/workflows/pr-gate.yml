# The gate that stands between a pull request and main.
#
# Four jobs. `build` proves the code compiles and the suite is green. `readiness` runs
# Tools/swiftgate: the deterministic rules, then each judge lane behind its evidence
# gate, then the scorer that alone decides. `conventions` checks the branch rules and
# the documents' links. `gate` sums the three into the one result to read.
#
# Nothing here can stop a merge by itself: branch protection is a 403 on this plan
# (ADR 0013). What stops it is the human who lands through /pr, and the pre-push hook
# in Tools/githooks that refuses main. For a team on a plan that has them, a ruleset
# requiring `gate` is the floor, and `gate` is the one name it would need.
name: PR gate

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled are here so applying the override label re-runs the gate
    # instead of leaving a stale red check.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The launch step below diffs against the base branch. A shallow clone has
          # no base to diff against.
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # Naming a specific iPhone pins the build to whatever the runner image
          # happens to ship this month. Take whichever one is actually there.
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 "$udid"
          # Boot it now, so it is warm by the time the launch test runs. Left to xcodebuild,
          # the boot happened inside the first UI test, took anywhere from 73 to 928 seconds
          # on these runners, and 3 of 5 runs failed on whichever test launched first.
          xcrun simctl bootstatus "$udid" -b

      - name: Test MindlensKit
        working-directory: Packages/MindlensKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme MindlensKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/MindlensKit.xcresult" \
            -quiet

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme mindlens \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -quiet

      # A green build says the app compiles, not that it runs. It once compiled cleanly and
      # then died on the first line of the composition root. Two launches — default, and the
      # largest accessibility text size — are the cheapest test that would have caught it.
      # They are also six minutes of an eighteen-minute job, and only the app target, its
      # plist and entitlements, the xcconfig, the project, the UI tests, the package manifest
      # or this workflow can break a launch. A pull request that touches none of them skips it.
      - name: Decide whether this change can break the launch
        id: launch
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            mindlens mindlens.xcodeproj mindlensUITests Config \
            Packages/MindlensKit/Package.swift .github/workflows/pr-gate.yml)
          if [ -n "$changed" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            printf 'Launch-relevant files changed:\n%s\n' "$changed"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No launch-relevant file changed — skipping the launch."
          fi

      - name: Launch the app
        if: steps.launch.outputs.needed == 'true'
        run: |
          set -o pipefail
          # A launch that fails on a starved runner is retried; a launch that crashes
          # fails all three times, which is the case the test exists for.
          xcodebuild test \
            -scheme mindlens \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:mindlensUITests \
            -retry-tests-on-failure -test-iterations 3 \
            -quiet

      - name: Verify the settings the documents claim
        run: Tools/check-build-settings.sh "id=${{ steps.sim.outputs.udid }}"

      # Not on the runner image, despite being on every developer machine here. Pinned
      # to a release and its checksum: `brew install` tracked latest, and a release
      # that adds a default rule turns a green branch red with no code change. Bump the
      # two lines together, and the local install to match.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint
        run: |
          set -euo pipefail
          swiftlint --strict
          # Tests are linted too. Leaving them out is how a force-unwrap in
          # TestSupport passed the gate while failing a local full-tree lint.
          xcrun swift-format lint --recursive --strict \
            Packages/MindlensKit/Sources Packages/MindlensKit/Tests mindlens

  readiness:
    name: Judge lanes and PR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      # The Claude Code action wants this for its own GitHub auth handshake.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base. Without full history there is no
          # merge base to find, and every commit on main since the branch started
          # would be attributed to this PR.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: Tools/swiftgate/go.mod
          cache-dependency-path: Tools/swiftgate/go.sum

      - name: Test the gate itself
        working-directory: Tools/swiftgate
        run: go test ./...

      - name: Build the gate
        working-directory: Tools/swiftgate
        run: go build -o "$RUNNER_TEMP/swiftgate" .

      # Deterministic rules run first and cost nothing. They also produce the brief the
      # judges read, retrieve the exemplars the idiom lane judges against, and assert each
      # lane's evidence: a lane's output is true only when it has something to judge,
      # everything it needs is on disk, and the config lets it score.
      - name: Prepare the review
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTGATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/swiftgate" prepare --pr ${{ github.event.pull_request.number }}'

      # The judgement half: one Claude Code run per lane, each behind its evidence gate
      # (prepare's outputs) and each returning its verdict as structured output validated
      # against the schema prepare published. Running as Claude Code rather than a direct
      # API call is what bills it to the subscription behind CLAUDE_CODE_OAUTH_TOKEN.
      # Each lane's model comes from .github/swiftgate.yml by way of prepare, and is
      # written into that lane's metrics record: a noise rate is a number about a lane
      # *and* a model, so changing one here without recording it would pool two judges.
      # continue-on-error so a rate limit becomes a CANNOT_EVALUATE with a re-run
      # instruction, rather than a bare red job with no explanation on the PR.
      # The token was once stored with a leading space. The action masked it, hid the
      # 401 behind "output hidden for security", and three runs failed with no cause.
      # Compare, never print.
      - name: Check the token is not padded
        if: steps.prep.outputs.verification == 'true' || steps.prep.outputs.idiom == 'true' || steps.prep.outputs.spec == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set."; exit 1; }
          [ "$TOKEN" = "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN has leading or trailing whitespace — re-set it with the value trimmed."; exit 1; }

      # Pinned to the commit behind v1 (v1.0.99 at the time), not the moving tag: the
      # action runs with a write token on this repository's pull requests.
      # Three runs once died at turn 1 with an empty modelUsage and the cause hidden;
      # show_full_output is the only way to read why the model was never called.
      # Not "/lane-x": the slash form resolved to nothing on the runner. Pointing at the
      # file keeps one copy of each rubric without depending on skill dispatch. The action
      # restores .claude/ from main because a PR head is untrusted, and keeps the PR's own
      # copy under .claude-pr/. Until a skill is on main, that copy is the only one on the
      # runner; once it is, the first path wins.
      - name: Verification lane
        id: verification
        if: steps.prep.outputs.verification == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Read .claude/skills/lane-verification/SKILL.md and follow it exactly. If that file
            does not exist, Glob for .claude-pr/**/lane-verification/SKILL.md, read the match,
            and follow that one exactly instead.
          claude_args: |
            --max-turns 40
            --model ${{ steps.prep.outputs.verification-model }}
            --allowedTools "Read,Grep,Glob"
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Idiom lane
        id: idiom
        if: steps.prep.outputs.idiom == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Read .claude/skills/lane-idiom/SKILL.md and follow it exactly. If that file
            does not exist, Glob for .claude-pr/**/lane-idiom/SKILL.md, read the match,
            and follow that one exactly instead.
          claude_args: |
            --max-turns 40
            --model ${{ steps.prep.outputs.idiom-model }}
            --allowedTools "Read,Grep,Glob"
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Spec lane
        id: spec
        if: steps.prep.outputs.spec == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Read .claude/skills/lane-spec/SKILL.md and follow it exactly. If that file
            does not exist, Glob for .claude-pr/**/lane-spec/SKILL.md, read the match,
            and follow that one exactly instead.
          claude_args: |
            --max-turns 40
            --model ${{ steps.prep.outputs.spec-model }}
            --allowedTools "Read,Grep,Glob"
            --json-schema '${{ steps.prep.outputs.schema }}'

      # Each lane's structured output becomes the file decide reads. A lane that did not
      # run leaves no file, and decide scores that as CANNOT_EVALUATE, not as a pass.
      # The action's execution file goes beside it: decide reads cost and duration off
      # it for the metrics record. Nobody here has seen that file's real shape, so the
      # raw copy is uploaded with the metrics and the first real run settles the guess.
      - name: Collect the verdicts
        if: always()
        env:
          VERIFICATION: ${{ steps.verification.outputs.structured_output }}
          IDIOM: ${{ steps.idiom.outputs.structured_output }}
          SPEC: ${{ steps.spec.outputs.structured_output }}
          VERIFICATION_EXECUTION: ${{ steps.verification.outputs.execution_file }}
          IDIOM_EXECUTION: ${{ steps.idiom.outputs.execution_file }}
          SPEC_EXECUTION: ${{ steps.spec.outputs.execution_file }}
        run: |
          for lane in verification idiom spec; do
            upper=$(printf '%s' "$lane" | tr a-z A-Z)
            value=$(printenv "$upper" || true)
            if [ -n "$value" ]; then
              printf '%s' "$value" > ".swiftgate/run/lane-$lane.json"
              echo "$lane: verdict collected"
            else
              echo "$lane: no structured output"
            fi
            execution=$(printenv "${upper}_EXECUTION" || true)
            if [ -n "$execution" ] && [ -f "$execution" ]; then
              cp "$execution" ".swiftgate/run/execution-$lane.json"
              echo "$lane: execution file collected ($(wc -c < "$execution") bytes)"
            else
              echo "$lane: no execution file"
            fi
          done

      # The scorer. This is the only step that decides, and it decides on enumerable
      # conditions: a static blocker, or a BLOCK or CANNOT_EVALUATE from a lane the
      # config has granted `blocks: true`. Every lane starts advisory and earns that on
      # its record (ADR 0021), so today a lane's worst verdict is reported, recorded and
      # not in the way. It also assigns the review level and its `review:<level>` label
      # (ADR 0017). One sticky comment per lane, each stamped with the head SHA so a
      # stale verdict reads as stale.
      - name: PR readiness
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWIFTGATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/swiftgate" decide \
            --comment \
            --inline \
            --ran verification=${{ steps.verification.outcome == 'success' }} \
            --ran idiom=${{ steps.idiom.outcome == 'success' }} \
            --ran spec=${{ steps.spec.outcome == 'success' }} \
            --json "$RUNNER_TEMP/findings.json"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftgate-findings
          path: |
            ${{ runner.temp }}/findings.json
            .swiftgate/run/
          if-no-files-found: ignore

      # One record per lane per run, kept for as long as the plan allows, under a name
      # `swiftgate outcomes` and `swiftgate metrics` can find by pull request. The raw
      # execution files ride along so the cost and duration guess can be checked.
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftgate-metrics-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .swiftgate/run/metrics.jsonl
            .swiftgate/run/execution-*.json
          if-no-files-found: ignore
          retention-days: 90

  # The rules a session cannot be relied on to remember: branch name, ADR numbers that
  # collide with another open pull request, size, and the documents' links. Seconds on
  # ubuntu; ADR 0013. The doc-link check used to sit at the end of the macOS build, so a
  # broken reference was reported seventeen minutes late, or not at all when the build
  # failed first.
  conventions:
    name: Branch, ADR numbers, size, doc links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the head branch, labels and body; the decisions on other PRs' heads
    steps:
      - uses: actions/checkout@v4
        with:
          # The doc-link check lets append-only history name a path that no longer
          # exists, provided git remembers it. A shallow clone remembers nothing.
          fetch-depth: 0
      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Tools/check-pr-conventions.sh ${{ github.event.pull_request.number }}
      - name: Check documentation links
        run: python3 Tools/check-doc-links.py

  gate:
    name: Gate
    if: always()
    needs: [build, readiness, conventions]
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        run: |
          set -euo pipefail
          build='${{ needs.build.result }}'
          readiness='${{ needs.readiness.result }}'
          conventions='${{ needs.conventions.result }}'
          echo "build: $build"
          echo "readiness: $readiness"
          echo "conventions: $conventions"
          failed=0
          [ "$build" = "success" ] || { echo "::error::Build or tests failed."; failed=1; }
          [ "$readiness" = "success" ] || { echo "::error::PR readiness is blocking this merge. Read the readiness comment on the pull request: it lists every condition that fired."; failed=1; }
          [ "$conventions" = "success" ] || { echo "::error::Branch name, an ADR number, or the size cap — read the conventions job."; failed=1; }
          exit $failed
