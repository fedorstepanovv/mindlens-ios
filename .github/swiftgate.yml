# How hard the merge gate bites.
#
# The rules themselves live in Tools/swiftgate/internal/scan/catalog.go. This file only
# retunes them, so changing the gate's temperament is a one-line review rather than a Go
# change. Valid severities: blocker, warning, nit, off. Rules SwiftLint already enforces as
# errors (`*Impl` names, force try/cast, TODOs) are not duplicated here.

# The reviewer's model and turn limit live in .github/workflows/pr-gate.yml on the
# claude_args line — they belong to the Claude Code step, not to this file.
max_diff_bytes: 180000

# Applying this label to a pull request lets a human merge past a blocker — but only
# with a written reason in the PR body on a line reading `Gate override: <why>`.
# The reason is copied into the gate's comment, so the decision stays on the record.
override_label: gate-override

# The judge lanes that score. Every lane's evidence is asserted and reported on every
# pull request; only a lane listed here can block. Each has a skill under
# .claude/skills/lane-<name>/. A lane that could not evaluate — no evidence, no run,
# output not the contract — is CANNOT_EVALUATE, and that blocks.
lanes: [verification, idiom, spec]

severities:
  # Absolute in CLAUDE.md and docs/ — these stop a merge.
  flutter/observable-object: blocker
  flutter/service-locator: blocker
  flutter/dart-file-naming: blocker
  arch/our-singleton: blocker
  arch/feature-imports-feature: blocker
  arch/imports-app-target: blocker
  arch/third-party-import: blocker
  design/fixed-font-size: blocker
  design/hardcoded-color: blocker
  core/calendar-current: blocker
  core/raw-date-now: blocker
  swift/dispatch-semaphore: blocker
  test/viewmodel-untested: blocker
  test/dto-without-fixture: blocker

  # Real, but the documents leave room for judgement.
  swift/gcd-queue: warning
  swift/combine-as-transport: warning
  design/print-logging: warning
  arch/dto-escapes-networking: warning
  flutter/widget-suffix: warning
